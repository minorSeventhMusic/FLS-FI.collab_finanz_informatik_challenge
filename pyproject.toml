[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge"
version = "0.1.0"
description = "The Bridge — AI-powered business-technical alignment orchestrator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "langgraph>=0.6",
  "streamlit>=1.50",
  "openai>=2.0",
  "langsmith",
  "google-genai",
  "elevenlabs",
  "python-dotenv",
  "streamlit-mic-recorder",
]

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
