[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-mvp"
version = "0.1.0"
description = "Demo scaffold for The Bridge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "langgraph",
  "streamlit",
]

[tool.setuptools.packages.find]
include = ["bridge_mvp*"]

